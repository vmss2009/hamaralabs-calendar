version: "3.8"

networks:
  hamaralabs-net:

volumes:
  db-data:

services:
  hamaralabs-calendar-db:
    container_name: hamaralabs-calendar-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: hamaralabs
      POSTGRES_PASSWORD: hamaralabs
      POSTGRES_DB: hamaralabs
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - hamaralabs-net

  hamaralabs-calendar:
    container_name: hamaralabs-calendar
    image: ghcr.io/vmss2009/hamaralabs-calendar:v6
    depends_on:
      - hamaralabs-calendar-db
    ports:
      - "3005:3000"
    env_file:
      - .env
    networks:
      - hamaralabs-net